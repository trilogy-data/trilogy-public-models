[engine]
dialect = "duck_db"
parallelism = 1

[engine.config]
enable_gcs = true
enable_python_datasources = true

# Deployed by `trilogy cloud sync` (see .github/workflows/cloud-sync.yml). The
# job bundles this whole directory, since the published tiles' query models
# and data/ingest/generation.py live outside data/, and refreshes only data/.
[cloud]
org = "trilogy-data"
operation = "refresh"
entrypoint = "data"
# The platform maximum. Each entity's extractor stops on its own time budget
# (DANISH_ODA_MAX_SECONDS, 2h) and saves its checkpoint, so a run that cannot
# finish the full-history bootstrap (~22k API pages, mostly ballots) still
# keeps its progress, and the next run resumes from it.
timeout_seconds = 18000
# Six-field cron: 05:00 UTC daily, after overnight source updates.
schedule = "0 0 5 * * *"
# DuckDB writes the tiles to gcs:// and the extractor keeps its SQLite
# checkpoints in the same bucket; the tenant SA holds no IAM on it.
secret_env = ["GOOGLE_HMAC_KEY", "GOOGLE_HMAC_SECRET"]
