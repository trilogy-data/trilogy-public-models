[project]
name = "trilogy-public-models"
dynamic = ["version", "dependencies"]
readme = {file = "README.md", content-type = "text/markdown"}
description = "Rich set of open data models for use with Trilogy"
authors = [
    {email = "preql-community@gmail.com"}
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://trilogydata.dev/"
Repository = "https://github.com/trilogy-data/trilogy-public-models"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = {find = {exclude = ["dist", "build", "*.tests", "*.tests.*", "tests.*", "tests", "docs", ".github", "examples"]}}

[tool.setuptools.package-data]
"*" = ["*.sql", "*.preql", "py.typed"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
version = {attr = "trilogy_public_models.__version__"}

[tool.mypy]
disable_error_code = ["import-untyped"]
# FAA and COVID ingest scripts are PEP 723 standalone scripts run via `uv run`
# — they self-declare deps (duckdb, polars, google-cloud-storage, httpx) that
# aren't in requirements.txt, and import each other as siblings rather than as a
# package.
exclude = [
    "trilogy_public_models/duckdb/faa/ingest/",
    "trilogy_public_models/duckdb/covid19_open_data/ingest/",
]

[[tool.mypy.overrides]]
module = ["trilogy_public_models.*"]
ignore_missing_imports = true